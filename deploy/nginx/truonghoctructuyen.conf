# nginx cho Teacher Workspace — server hbsf-web (xem docs/DEPLOY.md)
#
#   sudo cp deploy/nginx/truonghoctructuyen.conf /etc/nginx/sites-available/truonghoctructuyen
#   sudo ln -s /etc/nginx/sites-available/truonghoctructuyen /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Luồng:  trình duyệt → :8602 (nginx)
#           ├─ giao diện: file tĩnh trong /var/www/truonghoctructuyen (bản build của frontend)
#           └─ /api, /uploads → 127.0.0.1:8601 (pm2 "teacher-api")

upstream truonghoc_api {
    server 127.0.0.1:8601;
    keepalive 16;
}

server {
    listen 8602;
    listen [::]:8602;
    # Khi có tên miền: thay bằng tên miền và thêm khối HTTPS (certbot --nginx)
    server_name _;

    root /var/www/truonghoctructuyen;
    index index.html;

    # Ảnh bài làm / học liệu: backend giới hạn MAX_UPLOAD_MB=10 mỗi file, nhiều ảnh mỗi lần gửi
    client_max_body_size 50m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Chú ý: KHÔNG dùng add_header bên trong các location bên dưới,
    # nếu không nginx sẽ bỏ các header bảo mật khai báo ở đây.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://truonghoc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chấm bài / tạo đề bằng AI có thể mất vài phút
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # Gửi thẳng file upload sang backend, không đệm ra đĩa
        proxy_request_buffering off;
        # Backend đã gắn header bảo mật riêng => tránh bị lặp
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
    }

    # ---------- File đã tải lên (ảnh bài làm, học liệu) ----------
    location /uploads/ {
        proxy_pass http://truonghoc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
    }

    # ---------- Giao diện ----------
    # JS/CSS có mã hash trong tên file => cache lâu
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html luôn lấy bản mới để nhận phiên bản giao diện mới ngay sau khi cập nhật
    location = /index.html {
        expires -1;
    }

    # Ứng dụng 1 trang (SPA): mọi đường dẫn khác trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
